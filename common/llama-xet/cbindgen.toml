language = "C"
header = "/* Auto-generated by cbindgen — do not edit. */"
include_guard = "LLAMA_XET_H"
autogen_warning = "/* Auto-generated header: regenerate via `cargo build` in common/llama-xet. */"
style = "type"
cpp_compat = true
documentation = true
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true

# Our Rust types are already LlamaXet-prefixed manually, so no export
# prefix needed (would double-stamp to LlamaXetLlamaXetSession).

[parse]
parse_deps = false
